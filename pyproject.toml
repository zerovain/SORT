[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sort-spatial"
version = "1.0.0"
description = "Spatial Orthogonal Regularized Transcriptomic decomposition"
readme = "README.md"
requires-python = ">=3.8,<3.12"
license = {file = "LICENSE"}
keywords = [
  "spatial transcriptomics",
  "bioinformatics",
  "gene expression programs",
  "matrix factorization",
  "spatial atlas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.22,<2",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "anndata>=0.8,<1",
  "scanpy>=1.9,<2",
  "scikit-misc>=0.2,<1",
  "squidpy>=1.2,<2",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
  "torch>=2.4,<3",
]

[project.urls]
Homepage = "https://github.com/zerovain/SORT"
Repository = "https://github.com/zerovain/SORT"
Documentation = "https://github.com/zerovain/SORT_tutorial"
Issues = "https://github.com/zerovain/SORT/issues"

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12.3,<13"]
test = ["pytest>=7,<9", "build>=1,<2"]
docs = [
  "ipykernel>=6.25,<7",
  "jupytext>=1.16,<2",
  "nbconvert>=7.8,<8",
  "sphinx>=7.1,<8",
  "nbsphinx>=0.9,<1",
  "sphinx-rtd-theme>=2,<4",
  "myst-parser>=2,<3",
]

[tool.setuptools.packages.find]
include = ["sort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
