[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sort-spatial"
version = "1.0.1"
description = "Spatial Orthogonal Regularized Transcriptomic decomposition"
readme = "README.md"
requires-python = ">=3.8,<3.11"
license = {file = "LICENSE"}
keywords = [
  "spatial transcriptomics",
  "bioinformatics",
  "gene expression programs",
  "matrix factorization",
  "spatial atlas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy==1.22.4",
  "scipy==1.10.1",
  "pandas==2.0.3",
  "anndata==0.8.0",
  "scanpy==1.9.8",
  "scikit-misc==0.2.0",
  "numba==0.55.2",
  "llvmlite==0.38.1",
  "squidpy==1.2.3",
  "scikit-learn==1.3.2",
  "matplotlib==3.7.3",
  "seaborn==0.13.2",
  "torch==2.4.1",
  "setuptools>=68,<81",
  "pyarrow>=10,<26",
]

[project.urls]
Homepage = "https://github.com/zerovain/SORT"
Repository = "https://github.com/zerovain/SORT"
Documentation = "https://sort-tutorial.readthedocs.io/"
Issues = "https://github.com/zerovain/SORT/issues"

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12.3,<13"]
test = ["pytest>=7,<9", "build>=1,<2"]
tutorial = ["jupyterlab>=3.6,<4", "ipykernel>=6,<7"]
[tool.setuptools.packages.find]
include = ["sort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
